version: 2
project_name: tq
builds:
  - main: ./cmd/tq
    binary: tq
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/tentaqles/tentaqles/cli/internal/cmd.Version={{.Version}}"]
archives:
  - format_overrides: [{ goos: windows, formats: [zip] }]
checksum: { name_template: checksums.txt }
release:
  github: { owner: tentaqles, name: tentaqles }
  prerelease: auto   # tags with a pre-release suffix (v0.1.0-rc1) are marked pre-release
# Tap/bucket publishing pushes over SSH with per-repo deploy keys (write access on
# tentaqles/homebrew-tap and tentaqles/scoop-bucket), stored as the repository secrets
# HOMEBREW_TAP_DEPLOY_KEY / SCOOP_BUCKET_DEPLOY_KEY. GITHUB_TOKEN cannot push cross-repo.
homebrew_casks:
  - repository:
      owner: tentaqles
      name: homebrew-tap
      git:
        url: git@github.com:tentaqles/homebrew-tap.git
        private_key: '{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}'
    homepage: https://tentaqles.ai
    description: One terminal identity per workspace folder
scoops:
  - repository:
      owner: tentaqles
      name: scoop-bucket
      git:
        url: git@github.com:tentaqles/scoop-bucket.git
        private_key: '{{ .Env.SCOOP_BUCKET_DEPLOY_KEY }}'
    homepage: https://tentaqles.ai
    description: One terminal identity per workspace folder
