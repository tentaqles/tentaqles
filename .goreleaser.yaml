version: 2
project_name: tq
# Two names, one program (ADR-0021): `tentaqles` is the command of docs/IDEATION.md and `tq` its
# alias, which the plugin hook (plugin/scripts/tq_hook.sh) resolves. Both builds compile the same
# main package with the same flags, so the two binaries are byte for byte the same program: the
# browser shims and PATH-mask stubs copied from either one match the other
# (TestGoreleaserBuildsOneProgramUnderTwoNames). Keep the two entries identical but for id and
# binary.
builds:
  - id: tq
    main: ./cmd/tentaqles
    binary: tq
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/tentaqles/tentaqles/internal/cmd.Version={{.Version}} -X github.com/tentaqles/tentaqles/internal/cmd.Commit={{.FullCommit}}"]
  - id: tentaqles
    main: ./cmd/tentaqles
    binary: tentaqles
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/tentaqles/tentaqles/internal/cmd.Version={{.Version}} -X github.com/tentaqles/tentaqles/internal/cmd.Commit={{.FullCommit}}"]
archives:
  - ids: [tq, tentaqles]
    format_overrides: [{ goos: windows, formats: [zip] }]
checksum: { name_template: checksums.txt }
release:
  github: { owner: tentaqles, name: tentaqles }
  prerelease: auto   # tags with a pre-release suffix (v0.1.0-rc1) are marked pre-release
# Tap/bucket publishing pushes over SSH with per-repo deploy keys (write access on
# tentaqles/homebrew-tap and tentaqles/scoop-bucket), stored as the repository secrets
# HOMEBREW_TAP_DEPLOY_KEY / SCOOP_BUCKET_DEPLOY_KEY. GITHUB_TOKEN cannot push cross-repo.
# Both install every binary of the archive: tq and tentaqles.
homebrew_casks:
  - binaries: [tq, tentaqles]
    repository:
      owner: tentaqles
      name: homebrew-tap
      git:
        url: git@github.com:tentaqles/homebrew-tap.git
        private_key: '{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}'
    homepage: https://tentaqles.ai
    description: One terminal identity per workspace folder
scoops:
  - repository:
      owner: tentaqles
      name: scoop-bucket
      git:
        url: git@github.com:tentaqles/scoop-bucket.git
        private_key: '{{ .Env.SCOOP_BUCKET_DEPLOY_KEY }}'
    homepage: https://tentaqles.ai
    description: One terminal identity per workspace folder
