name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      # A release tag must name a commit already merged to main, and the
      # plugin version must agree between plugin.json and the dev
      # marketplace. The root marketplace is pinned to this tag's commit
      # only afterwards, in the post-release PR (docs/RELEASING.md).
      - name: tag is on main and plugin versions agree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main; tag the merged main commit (docs/RELEASING.md)"
            exit 1
          fi
          pv=$(jq -er '.version' plugin/.claude-plugin/plugin.json)
          mv=$(jq -er '.plugins[] | select(.name == "tentaqles") | .version' plugin/.claude-plugin/marketplace.json)
          if [ -z "$pv" ] || [ "$pv" != "$mv" ]; then
            echo "::error file=plugin/.claude-plugin/marketplace.json::plugin version '$mv' differs from plugin.json '$pv'"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main; plugin version $pv"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26' }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}

  desktop:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: install nsis (windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # choco updates the machine PATH, but this job's PATH is already resolved; add it explicitly
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'

      - name: download tq release asset (linux/macos)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Linux installers are amd64-only; on macOS we ship the runner's
          # native architecture so the bundled tq matches the app binary.
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ "$(uname -m)" = "arm64" ]; then target=darwin_arm64; else target=darwin_amd64; fi
          else
            target=linux_amd64
          fi
          gh release download "$GITHUB_REF_NAME" -p "tq_*_${target}.*" -p checksums.txt -D /tmp/tqdl --clobber
          cd /tmp/tqdl
          archive=$(ls tq_*_${target}.* | head -n1)
          # the bundled tq must be the archive goreleaser published (docs/threat-model.md TM-1)
          want=$(awk -v f="$archive" '$2 == f {print $1}' checksums.txt)
          if command -v sha256sum >/dev/null 2>&1; then got=$(sha256sum "$archive" | cut -d' ' -f1); else got=$(shasum -a 256 "$archive" | cut -d' ' -f1); fi
          if [ -z "$want" ] || [ "$got" != "$want" ]; then echo "::error::checksum mismatch for $archive"; exit 1; fi
          tar -xzf "$archive" 2>/dev/null || unzip -o "$archive"
          mkdir -p "$GITHUB_WORKSPACE/desktop/build/bin"
          cp tq "$GITHUB_WORKSPACE/desktop/build/bin/tq"
          chmod +x "$GITHUB_WORKSPACE/desktop/build/bin/tq"

      - name: download tq release asset (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\tqdl" | Out-Null
          gh release download "$env:GITHUB_REF_NAME" -p "tq_*_windows_amd64.*" -p checksums.txt -D "$env:RUNNER_TEMP\tqdl" --clobber
          $archive = Get-ChildItem "$env:RUNNER_TEMP\tqdl\tq_*_windows_amd64.*" | Select-Object -First 1
          # the bundled tq must be the archive goreleaser published (docs/threat-model.md TM-1)
          $want = Get-Content "$env:RUNNER_TEMP\tqdl\checksums.txt" | Where-Object { ($_.Trim() -split '\s+')[1] -eq $archive.Name } | ForEach-Object { ($_.Trim() -split '\s+')[0] } | Select-Object -First 1
          $got = (Get-FileHash $archive.FullName -Algorithm SHA256).Hash.ToLower()
          if (-not $want -or $got -ne $want) { throw "checksum mismatch for $($archive.Name)" }
          Expand-Archive -Path $archive.FullName -DestinationPath "$env:RUNNER_TEMP\tqdl" -Force
          New-Item -ItemType Directory -Force -Path "desktop\build\bin" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\tqdl\tq.exe" "desktop\build\bin\tq.exe"

      - name: build (windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: |
          makensis /VERSION
          wails build -nsis
          if (-not (Get-ChildItem build/bin -Filter '*-installer.exe' -ErrorAction SilentlyContinue)) { throw 'NSIS installer was not produced' }

      - name: build (macos)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -euo pipefail
          wails build
          # BundledTQPath() looks next to the running executable, which for a
          # .app bundle is Contents/MacOS.
          cp build/bin/tq build/bin/tentaqles-setup.app/Contents/MacOS/tq
          chmod +x build/bin/tentaqles-setup.app/Contents/MacOS/tq
          hdiutil create -volname "Tentaqles Setup" -srcfolder build/bin/tentaqles-setup.app -ov -format UDZO build/bin/tentaqles-setup.dmg

      - name: build (linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          set -euo pipefail
          wails build -tags webkit2_41
          curl -L -o /tmp/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          rm -rf build/AppDir
          mkdir -p build/AppDir/usr/bin
          cp build/bin/tentaqles-setup build/AppDir/usr/bin/tentaqles-setup
          cp build/bin/tq build/AppDir/usr/bin/tq
          chmod +x build/AppDir/usr/bin/tentaqles-setup build/AppDir/usr/bin/tq
          cp build/appicon.png build/AppDir/tentaqles-setup.png
          cat > build/AppDir/tentaqles-setup.desktop <<'EOF'
          [Desktop Entry]
          Name=Tentaqles Setup
          Exec=tentaqles-setup
          Icon=tentaqles-setup
          Type=Application
          Categories=Development;
          EOF
          cat > build/AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$(dirname "$0")/usr/bin/tentaqles-setup" "$@"
          EOF
          chmod +x build/AppDir/AppRun
          # --appimage-extract-and-run avoids needing FUSE (libfuse2) on the runner
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run build/AppDir build/bin/tentaqles-setup.AppImage
          test -s build/bin/tentaqles-setup.AppImage

      - name: upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/build/bin/*-installer.exe
            desktop/build/bin/*.dmg
            desktop/build/bin/*.AppImage
