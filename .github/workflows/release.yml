name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # provenance: a signed statement, kept by GitHub, that this workflow built
    # each archive from this tag (docs/threat-model.md TM-2)
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      # A release tag must name a commit already merged to main, and the
      # plugin version must agree between plugin.json and the dev
      # marketplace. The root marketplace is pinned to this tag's commit
      # only afterwards, in the post-release PR (docs/RELEASING.md).
      - name: tag is on main and plugin versions agree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main; tag the merged main commit (docs/RELEASING.md)"
            exit 1
          fi
          pv=$(jq -er '.version' plugin/.claude-plugin/plugin.json)
          mv=$(jq -er '.plugins[] | select(.name == "tentaqles") | .version' plugin/.claude-plugin/marketplace.json)
          if [ -z "$pv" ] || [ "$pv" != "$mv" ]; then
            echo "::error file=plugin/.claude-plugin/marketplace.json::plugin version '$mv' differs from plugin.json '$pv'"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME is on main; plugin version $pv"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26' }
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
      - name: attest the tq archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
