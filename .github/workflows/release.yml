name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: install wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: install nsis (windows)
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          # choco updates the machine PATH, but this job's PATH is already resolved; add it explicitly
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files (x86)\NSIS'

      - name: download tq release asset (linux/macos)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Linux installers are amd64-only; on macOS we ship the runner's
          # native architecture so the bundled tq matches the app binary.
          if [ "${{ runner.os }}" = "macOS" ]; then
            if [ "$(uname -m)" = "arm64" ]; then target=darwin_arm64; else target=darwin_amd64; fi
          else
            target=linux_amd64
          fi
          gh release download "$GITHUB_REF_NAME" -p "tq_*_${target}.*" -D /tmp/tqdl --clobber
          cd /tmp/tqdl
          archive=$(ls tq_*_${target}.* | head -n1)
          tar -xzf "$archive" 2>/dev/null || unzip -o "$archive"
          mkdir -p "$GITHUB_WORKSPACE/desktop/build/bin"
          cp tq "$GITHUB_WORKSPACE/desktop/build/bin/tq"
          chmod +x "$GITHUB_WORKSPACE/desktop/build/bin/tq"

      - name: download tq release asset (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\tqdl" | Out-Null
          gh release download "$env:GITHUB_REF_NAME" -p "tq_*_windows_amd64.*" -D "$env:RUNNER_TEMP\tqdl" --clobber
          $archive = Get-ChildItem "$env:RUNNER_TEMP\tqdl\tq_*_windows_amd64.*" | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath "$env:RUNNER_TEMP\tqdl" -Force
          New-Item -ItemType Directory -Force -Path "desktop\build\bin" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\tqdl\tq.exe" "desktop\build\bin\tq.exe"

      - name: build (windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: |
          makensis /VERSION
          wails build -nsis
          if (-not (Get-ChildItem build/bin -Filter '*-installer.exe' -ErrorAction SilentlyContinue)) { throw 'NSIS installer was not produced' }

      - name: build (macos)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: |
          set -euo pipefail
          wails build
          # BundledTQPath() looks next to the running executable, which for a
          # .app bundle is Contents/MacOS.
          cp build/bin/tq build/bin/tentaqles-setup.app/Contents/MacOS/tq
          chmod +x build/bin/tentaqles-setup.app/Contents/MacOS/tq
          hdiutil create -volname "Tentaqles Setup" -srcfolder build/bin/tentaqles-setup.app -ov -format UDZO build/bin/tentaqles-setup.dmg

      - name: build (linux)
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          set -euo pipefail
          wails build -tags webkit2_41
          curl -L -o /tmp/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          rm -rf build/AppDir
          mkdir -p build/AppDir/usr/bin
          cp build/bin/tentaqles-setup build/AppDir/usr/bin/tentaqles-setup
          cp build/bin/tq build/AppDir/usr/bin/tq
          chmod +x build/AppDir/usr/bin/tentaqles-setup build/AppDir/usr/bin/tq
          cp build/appicon.png build/AppDir/tentaqles-setup.png
          cat > build/AppDir/tentaqles-setup.desktop <<'EOF'
          [Desktop Entry]
          Name=Tentaqles Setup
          Exec=tentaqles-setup
          Icon=tentaqles-setup
          Type=Application
          Categories=Development;
          EOF
          cat > build/AppDir/AppRun <<'EOF'
          #!/bin/sh
          exec "$(dirname "$0")/usr/bin/tentaqles-setup" "$@"
          EOF
          chmod +x build/AppDir/AppRun
          # --appimage-extract-and-run avoids needing FUSE (libfuse2) on the runner
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run build/AppDir build/bin/tentaqles-setup.AppImage
          test -s build/bin/tentaqles-setup.AppImage

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            desktop/build/bin/*-installer.exe
            desktop/build/bin/*.dmg
            desktop/build/bin/*.AppImage
