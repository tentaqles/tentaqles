name: fuzz

# Weekly fuzzing of the hook-time state-dir matcher against its oracle
# (internal/cmd/statedir_equiv_test.go). Commit any crasher it finds under
# internal/cmd/testdata/fuzz.
on:
  schedule:
    - cron: "17 4 * * 1" # Monday 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: FuzzProtectedMention
        timeout-minutes: 5
        run: go test ./internal/cmd/ -run '^$' -fuzz '^FuzzProtectedMention$' -fuzztime 60s
      - name: FuzzRootMatcher
        timeout-minutes: 5
        run: go test ./internal/cmd/ -run '^$' -fuzz '^FuzzRootMatcher$' -fuzztime 60s
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: internal/cmd/testdata/fuzz
          if-no-files-found: ignore
