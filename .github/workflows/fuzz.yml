name: fuzz

# Weekly fuzzing of the hook-time state-dir matcher against its oracle
# (internal/cmd/statedir_equiv_test.go). Commit any crasher it finds under
# internal/cmd/testdata/fuzz.
on:
  schedule:
    - cron: "17 4 * * 1" # Monday 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: FuzzProtectedMention
        timeout-minutes: 5
        run: go test ./internal/cmd/ -run '^$' -fuzz '^FuzzProtectedMention$' -fuzztime 60s
      - name: FuzzRootMatcher
        timeout-minutes: 5
        run: go test ./internal/cmd/ -run '^$' -fuzz '^FuzzRootMatcher$' -fuzztime 60s
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-crashers
          path: internal/cmd/testdata/fuzz
          if-no-files-found: ignore
