name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26' }
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: build tq
        if: runner.os != 'Windows'
        run: go build -o tq ./cmd/tq
      - name: build tq (windows)
        if: runner.os == 'Windows'
        run: go build -o tq.exe ./cmd/tq
      - name: goreleaser config check
        if: runner.os == 'Linux'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          args: check
      - name: smoke (bash hook)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GIT_CONFIG_NOSYSTEM: 1
        run: |
          export TQ_HOME=$(mktemp -d) HOME=$(mktemp -d) GIT_CONFIG_GLOBAL=$HOME/.gitconfig
          mkdir -p $HOME/work && ./tq init $HOME/work && ./tq add acme --git-email a@acme.com
          eval "$(./tq activate bash)"
          # PROMPT_COMMAND only fires at an interactive prompt; call the hook explicitly after each cd
          cd $HOME/work/acme; __tq_hook; test "$TQ_WS" = acme
          cd /; __tq_hook; test -z "${TQ_WS:-}"
      - name: smoke (pwsh hook)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GIT_CONFIG_NOSYSTEM: 1
        run: |
          $env:TQ_HOME = Join-Path $env:RUNNER_TEMP "tqh"; $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "home"
          $env:GIT_CONFIG_GLOBAL = "$env:USERPROFILE\.gitconfig"
          New-Item -ItemType Directory -Force "$env:USERPROFILE\work" | Out-Null
          .\tq.exe init "$env:USERPROFILE\work"; .\tq.exe add acme --git-email a@acme.com
          .\tq.exe activate pwsh | Out-String | Invoke-Expression
          Set-Location "$env:USERPROFILE\work\acme"; prompt | Out-Null; if ($env:TQ_WS -ne 'acme') { throw "hook failed: $env:TQ_WS" }
          Set-Location \; prompt | Out-Null; if ($env:TQ_WS) { throw "unset failed" }

  # Known vulnerabilities in the Go code tq calls, standard library included
  # (docs/threat-model.md TM-5). setup-go takes the newest 1.26 patch, the
  # same toolchain the release builds with.
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26' }
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  # The root marketplace pins plugin/ at a release tag and that tag's
  # commit (docs/RELEASING.md). Fail unless the tag exists, resolves to the
  # pinned sha, and that sha is on main. Skipped while the file is absent.
  marketplace-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: root marketplace sha is the tag's commit and on main
        shell: bash
        run: |
          set -euo pipefail
          f=.claude-plugin/marketplace.json
          if [ ! -e "$f" ]; then
            echo "$f absent (added by the first post-release PR); nothing to check"
            exit 0
          fi
          git fetch --tags --force origin '+refs/heads/main:refs/remotes/origin/main'
          ref=$(jq -er '.plugins[] | select(.name == "tentaqles") | .source.ref' "$f")
          sha=$(jq -er '.plugins[] | select(.name == "tentaqles") | .source.sha' "$f")
          if ! printf '%s' "$sha" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error file=$f::sha '$sha' is not 40 lowercase hex"
            exit 1
          fi
          if ! printf '%s' "$ref" | grep -Eqx 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error file=$f::ref '$ref' is not a release tag vX.Y.Z"
            exit 1
          fi
          if ! got=$(git rev-parse --verify --quiet "refs/tags/$ref^{commit}"); then
            echo "::error file=$f::tag '$ref' does not exist"
            exit 1
          fi
          if [ "$got" != "$sha" ]; then
            echo "::error file=$f::tag '$ref' is commit $got, the marketplace pins $sha"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error file=$f::pinned commit $sha is not on origin/main"
            exit 1
          fi
          echo "marketplace pins $ref at $sha, on main"

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      # Keep in step with [project].dependencies in plugin/pyproject.toml.
      # fastembed is not among them — it lives in the `embeddings` extra, and
      # memory writes degrade to a NULL embedding without it. Leaving it
      # uninstalled here is what keeps that degradation honestly tested
      # (see plugin/tests/test_embeddings_optional.py).
      - run: pip install pyyaml pathspec pytest numpy
      - name: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/plugin
        run: python -m pytest plugin/tests -q

  templates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_VERSION: 0.10.6
      # pip-installed templates (no uv.lock) and their isolated build env use
      # exact versions (exported from templates/ml-starter/uv.lock).
      PIP_CONSTRAINT: ${{ github.workspace }}/templates/ci-constraints.txt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.12' }
      # Each template is self-contained; tests use fakes (no network, no DB).
      # A template with a uv.lock is installed from it (uv sync --frozen) into
      # its own venv; any other templates/*/ with a pyproject.toml is
      # pip-installed with its test extra under PIP_CONSTRAINT. Every
      # templates/*/tests runs on its own, so a new template needs no edit here.
      - run: python -m pip install "uv==${UV_VERSION}"
      - name: install templates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest
          for d in templates/*/; do
            if [ -f "${d}uv.lock" ]; then
              uv sync --frozen --project "${d%/}" --extra test
            elif [ -f "${d}pyproject.toml" ]; then
              python -m pip install -e "${d%/}[test]"
            fi
          done
      - name: test templates
        shell: bash
        run: |
          set -euo pipefail
          for t in templates/*/tests; do
            d="${t%/tests}"
            echo "::group::${t}"
            if [ -f "${d}/uv.lock" ]; then
              uv run --frozen --project "$d" python -m pytest "$t" -q
            else
              python -m pytest "$t" -q
            fi
            echo "::endgroup::"
          done

  # The cloud pack's Rego bundle and the cloud template policies (spec D
  # §7.4): parse and compile under Rego v1 with OPA 1.x, then run the opa
  # test fixtures. OPA is the release binary at an exact version, checked
  # against its published sha256 before it runs.
  opa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      OPA_VERSION: v1.21.1
      OPA_SHA256: 668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: install opa
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  $RUNNER_TEMP/opa" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/opa"
          "$RUNNER_TEMP/opa" version
      - name: opa check
        run: |
          "$RUNNER_TEMP/opa" check --strict internal/packs/cloud/policy/rego/ plugin/templates/packs/cloud/
      - name: opa test
        run: |
          "$RUNNER_TEMP/opa" test -v internal/packs/cloud/policy/rego/
          "$RUNNER_TEMP/opa" test -v plugin/templates/packs/cloud/

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: '1.26' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - name: apt deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: frontend checks
        working-directory: desktop/frontend
        run: |
          npm ci
          npm run build
          npx tsc --noEmit
          npm test
      - name: go vet + test
        working-directory: desktop
        run: |
          go vet ./...
          go test ./...
