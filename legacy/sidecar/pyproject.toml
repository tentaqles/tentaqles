[project]
name = "sidecar"
version = "0.1.0"
description = "Python sidecar for Tentaqles (FastAPI backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pywinpty>=3.0.3",
    "sse-starlette>=2.0.0",
    "watchfiles>=1.0.0",
    "mcp>=1.12.0",
    "httpx>=0.28.0",
    "apscheduler>=3.11.0",
]

[project.scripts]
tentaqles = "sidecar.cli:main"
workspace-mcp = "sidecar.mcp_server.__main__:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "ruff>=0.15.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sidecar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
