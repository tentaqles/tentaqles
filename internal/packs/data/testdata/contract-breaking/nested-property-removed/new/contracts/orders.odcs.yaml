apiVersion: v3.0.2
kind: DataContract
id: acme-orders
name: orders
version: 1.3.0
status: active
servers:
  - server: prod
    type: postgres
    host: db.acme.test
    database: analytics
    schema: marts
schema:
  - id: orders_obj
    name: orders
    physicalName: fct_orders
    physicalType: table
    properties:
      - id: order_id_prop
        name: order_id
        logicalType: integer
        physicalType: bigint
        primaryKey: true
        primaryKeyPosition: 1
        required: true
        unique: true
      - id: line_no_prop
        name: line_no
        logicalType: integer
        physicalType: int
        primaryKey: true
        primaryKeyPosition: 2
        required: true
      - id: status_prop
        name: status
        logicalType: string
        physicalType: varchar(20)
        required: true
        enum: [placed, shipped, delivered]
        logicalTypeOptions:
          maxLength: 20
          pattern: "^[a-z]+$"
      - id: amount_prop
        name: amount
        logicalType: number
        physicalType: decimal(12,2)
        logicalTypeOptions:
          minimum: 0
          maximum: 100000
        quality:
          - id: amount_not_null
            metric: nullValues
            mustBeLessThan: 1
      - id: ordered_at_prop
        name: ordered_at
        logicalType: date
        physicalType: date
        partitioned: true
        partitionKeyPosition: 1
      - id: customer_prop
        name: customer
        logicalType: object
        properties:
          - id: customer_ref_prop
            name: customer_ref
            logicalType: string
            physicalType: varchar(64)
    quality:
      - id: orders_rowcount
        metric: rowCount
        mustBeGreaterThan: 100
slaProperties:
  - property: latency
    value: 4
    unit: d
    element: orders.ordered_at
  - property: retention
    value: 3
    unit: y
