AWSTemplateFormatVersion: "2010-09-09"
Description: acme stack for tester
Parameters:
  DbPassword:
    Type: String
    NoEcho: true
Conditions:
  IsProd: !Equals [!Ref Env, prod]
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-assets"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: "false"
      Tags:
        - Key: tq-allow
          Value: "IAC003: public assets bucket"
        - Key: team
          Value: acme
  Db:
    Type: AWS::RDS::DBInstance
    Condition: IsProd
    Properties:
      Engine: postgres
      MasterUsername: tester
      MasterUserPassword: !Ref DbPassword
      PubliclyAccessible: true
      StorageEncrypted: false
      Port: 5432
      VPCSecurityGroups:
        - !GetAtt Sg.GroupId
  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Join ["", ["web ", !Ref "AWS::Region"]]
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          FromPort: 22
          ToPort: 22
          IpProtocol: tcp
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          Effect: Allow
          Principal: "*"
          Action: sts:AssumeRole
      Policies:
        - PolicyName: all
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: "*"
                Resource: !If [IsProd, "*", !GetAtt [Bucket, Arn]]
      Tags:
        - Key: api_token
          Value: tester-literal-token-123456
Outputs:
  BucketArn:
    Value: !GetAtt Bucket.Arn
