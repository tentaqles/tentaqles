id: gh
name: GitHub
category: vcs
docs: https://cli.github.com
cli:
  command: gh
  version_args: ["--version"]
install:
  windows:
    winget: "GitHub.cli"
    scoop: "gh"
  macos:
    brew: "gh"
  linux:
    apt: "gh"
identity:
  env:
    GH_CONFIG_DIR: "{dir}"
login:
  args: ["auth", "login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [gh, hub]
  env: [GH_TOKEN, GITHUB_TOKEN, GITHUB_PERSONAL_ACCESS_TOKEN, GH_ENTERPRISE_TOKEN, GITHUB_ENTERPRISE_TOKEN, GH_CONFIG_DIR, GH_HOST]
