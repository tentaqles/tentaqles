id: gcloud
name: Google Cloud
category: cloud
docs: https://cloud.google.com/sdk/gcloud
cli:
  command: gcloud
  version_args: ["--version"]
install:
  windows:
    winget: "Google.CloudSDK"
    url: "https://cloud.google.com/sdk/docs/install"
  macos:
    url: "https://cloud.google.com/sdk/docs/install"
  linux:
    url: "https://cloud.google.com/sdk/docs/install"
identity:
  env:
    CLOUDSDK_CONFIG: "{dir}"
login:
  args: ["auth", "login"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  executables: [gcloud, gsutil, bq]
  images: ["google/cloud-sdk", "cloudsdktool/google-cloud-cli"]
  env: [CLOUDSDK_CONFIG, GOOGLE_APPLICATION_CREDENTIALS, GOOGLE_CLOUD_PROJECT, CLOUDSDK_CORE_PROJECT, CLOUDSDK_AUTH_ACCESS_TOKEN_FILE]
  paths: ["~/.config/gcloud", "%APPDATA%/gcloud"]
  modules: [google.cloud]
  psmodules: [GoogleCloud]
  cmdlets: ["*-Gcs*", "*-Gce*"]
  hosts: [oauth2.googleapis.com, sts.googleapis.com, iam.googleapis.com, iamcredentials.googleapis.com,
    cloudresourcemanager.googleapis.com, serviceusage.googleapis.com, compute.googleapis.com,
    container.googleapis.com, run.googleapis.com, cloudfunctions.googleapis.com, cloudbuild.googleapis.com,
    artifactregistry.googleapis.com, secretmanager.googleapis.com, cloudkms.googleapis.com,
    sqladmin.googleapis.com, bigquery.googleapis.com, pubsub.googleapis.com, logging.googleapis.com,
    monitoring.googleapis.com, dns.googleapis.com, appengine.googleapis.com, firestore.googleapis.com,
    spanner.googleapis.com, dataproc.googleapis.com, dataflow.googleapis.com, aiplatform.googleapis.com,
    storage.googleapis.com/storage/, storage.googleapis.com/upload/storage/, gcr.io]
  mcp: [gcloud, gcp, googlecloud, bigquery]
