id: gcloud
name: Google Cloud
category: cloud
docs: https://cloud.google.com/sdk/gcloud
cli:
  command: gcloud
  version_args: ["--version"]
install:
  windows:
    winget: "Google.CloudSDK"
    url: "https://cloud.google.com/sdk/docs/install"
  macos:
    url: "https://cloud.google.com/sdk/docs/install"
  linux:
    url: "https://cloud.google.com/sdk/docs/install"
identity:
  env:
    CLOUDSDK_CONFIG: "{dir}"
login:
  args: ["auth", "login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [gcloud, gsutil, bq]
  env: [CLOUDSDK_CONFIG, GOOGLE_APPLICATION_CREDENTIALS, GOOGLE_CLOUD_PROJECT, CLOUDSDK_CORE_PROJECT, CLOUDSDK_AUTH_ACCESS_TOKEN_FILE]
