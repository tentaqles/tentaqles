id: supabase
name: Supabase
category: data
docs: https://supabase.com/docs/guides/local-development/cli/getting-started
cli:
  command: supabase
  version_args: ["--version"]
install:
  # Only the Homebrew tap. The npm package refuses global installs ("npm install -g supabase"
  # always fails), so Windows and Linux have no method and print the docs page.
  macos:
    brew: "supabase/tap/supabase"
login:
  args: ["login"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  executables: [supabase]
  env: [SUPABASE_ACCESS_TOKEN]
  paths: ["~/.supabase"]
  hosts: [api.supabase.com, supabase.co]
  mcp: [supabase]
  mcp_packages: ["@supabase/mcp-server-supabase", "mcp/supabase"]
  mcp_hosts: [mcp.supabase.com]
