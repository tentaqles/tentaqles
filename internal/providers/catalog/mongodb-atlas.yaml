# Generated from verified research; edit deliberately.
id: mongodb-atlas
name: "MongoDB Atlas"
category: data
docs: https://www.mongodb.com/docs/atlas/cli/
cli:
  command: atlas
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [atlas]
  env: [MONGODB_ATLAS_PUBLIC_API_KEY, MONGODB_ATLAS_PRIVATE_API_KEY, MCLI_PUBLIC_API_KEY, MCLI_PRIVATE_API_KEY]
