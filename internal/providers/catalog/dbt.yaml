# Generated from verified research; edit deliberately.
id: dbt
name: "dbt"
category: data
docs: https://docs.getdbt.com/docs/core/connect-data-platform/connection-profiles
cli:
  command: dbt
  version_args: ["--version"]
install:
  windows:
    pip: "dbt-core"
  macos:
    pip: "dbt-core"
  linux:
    pip: "dbt-core"
# profiles.yml holds host, user and password per target. No login: credentials are written into that file by hand. There is no brew formula named dbt.
identity:
  env:
    DBT_PROFILES_DIR: "{dir}"
verify:
  args: ["debug"]
  logged_out_when: 'profiles\.yml file \[ERROR not found\]'
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
# A generic tool: it talks to whatever the project configures, so its command is
# never denied by name; only its global credential files and vendor endpoints are.
match:
  env: [DBT_CLOUD_API_KEY, DBT_PROFILES_DIR]
  paths: ["~/.dbt/profiles.yml"]
  hosts: [cloud.getdbt.com]
