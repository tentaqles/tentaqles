# Generated from verified research; edit deliberately.
id: dbt
name: "dbt"
category: data
docs: https://docs.getdbt.com/docs/core/connect-data-platform/connection-profiles
cli:
  command: dbt
  version_args: ["--version"]
install:
  windows:
    pip: "dbt-core"
  macos:
    pip: "dbt-core"
  linux:
    pip: "dbt-core"
# profiles.yml holds host, user and password per target. No login: credentials are written into that file by hand. There is no brew formula named dbt.
identity:
  env:
    DBT_PROFILES_DIR: "{dir}"
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  env: [DBT_CLOUD_API_KEY]
