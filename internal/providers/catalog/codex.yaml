id: codex
name: Codex CLI
category: agent
docs: https://developers.openai.com/codex/cli
cli:
  command: codex
  version_args: ["--version"]
install:
  windows:
    npm: "@openai/codex"
  macos:
    npm: "@openai/codex"
  linux:
    npm: "@openai/codex"
identity:
  env:
    CODEX_HOME: "{dir}"
login:
  args: ["login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [codex]
  env: [CODEX_HOME]
