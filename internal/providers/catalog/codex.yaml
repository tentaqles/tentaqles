id: codex
name: Codex CLI
category: agent
docs: https://developers.openai.com/codex/cli
cli:
  command: codex
  version_args: ["--version"]
install:
  windows:
    npm: "@openai/codex"
  macos:
    npm: "@openai/codex"
  linux:
    npm: "@openai/codex"
identity:
  env:
    CODEX_HOME: "{dir}"
login:
  args: ["login"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
match:
  executables: [codex]
  env: [CODEX_HOME]
  paths: ["~/.codex/auth.json"]
  mcp: [codex]
