id: discord
name: Discord
category: chat
docs: https://discord.com/developers/docs
# No official command-line client; reached through an MCP connector or the bot API only. The
# MCP entry itself is a bundle catalog matter (tq bundle), not a package tq installs.
cli: null
notes: "No CLI to install or log in. A bot token is the credential; a Claude session reaches Discord through an MCP connector added to claude.bundle.mcp."
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  env: [DISCORD_BOT_TOKEN, DISCORD_TOKEN]
  paths: ["%APPDATA%/discord", "~/.config/discord", "~/Library/Application Support/discord"]
  hosts: [discord.com/api/, discordapp.com/api/, gateway.discord.gg]
  mcp: [discord]
  mcp_packages: ["mcp-discord"]
