# Generated from verified research; edit deliberately.
id: continue
name: "Continue"
category: agent
docs: https://docs.continue.dev/cli
cli:
  command: cn
  version_args: ["--version"]
install:
  windows:
    npm: "@continuedev/cli"
  macos:
    npm: "@continuedev/cli"
  linux:
    npm: "@continuedev/cli"
# auth.json follows the variable. No verify: the CLI has no whoami.
identity:
  env:
    CONTINUE_GLOBAL_DIR: "{dir}"
login:
  args: ["login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [cn]
  env: [CONTINUE_GLOBAL_DIR]
