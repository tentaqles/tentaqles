# Generated from verified research; edit deliberately.
id: influx
name: "InfluxDB"
category: data
docs: https://docs.influxdata.com/influxdb/v2/reference/cli/influx/config/
cli:
  command: influx
  version_args: ["version"]
install:
  macos:
    brew: "influxdb-cli"
  linux:
    url: "https://docs.influxdata.com/influxdb/v2/tools/influx-cli/"
# The configs file holds an API token per named connection.
identity:
  env:
    INFLUX_CONFIGS_PATH: "{dir}/configs"
login:
  args: ["config", "create"]
verify:
  args: ["config", "list"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
match:
  executables: [influx]
  env: [INFLUX_TOKEN, INFLUX_HOST, INFLUX_CONFIGS_PATH]
  paths: ["~/.influxdbv2"]
  hosts: [cloud2.influxdata.com]
  mcp: [influx, influxdb]
