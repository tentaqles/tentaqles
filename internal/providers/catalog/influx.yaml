# Generated from verified research; edit deliberately.
id: influx
name: "InfluxDB"
category: data
docs: https://docs.influxdata.com/influxdb/v2/reference/cli/influx/config/
cli:
  command: influx
  version_args: ["version"]
install:
  macos:
    brew: "influxdb-cli"
  linux:
    url: "https://docs.influxdata.com/influxdb/v2/tools/influx-cli/"
# The configs file holds an API token per named connection.
identity:
  env:
    INFLUX_CONFIGS_PATH: "{dir}/configs"
login:
  args: ["config", "create"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [influx]
  env: [INFLUX_TOKEN, INFLUX_HOST, INFLUX_CONFIGS_PATH]
