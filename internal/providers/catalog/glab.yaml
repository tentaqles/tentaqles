id: glab
name: GitLab
category: vcs
docs: https://gitlab.com/gitlab-org/cli
cli:
  command: glab
  version_args: ["--version"]
install:
  windows:
    winget: "GLab.GLab"
    scoop: "glab"
  macos:
    brew: "glab"
  linux:
    apt: "glab"
identity:
  env:
    GLAB_CONFIG_DIR: "{dir}"
login:
  args: ["auth", "login"]
verify:
  args: ["auth", "status"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  executables: [glab]
  env: [GITLAB_TOKEN, GLAB_CONFIG_DIR, GITLAB_HOST]
  paths: ["~/.config/glab-cli", "%APPDATA%/glab-cli"]
  hosts: [gitlab.com/api/, gitlab.com/oauth/]
  git_hosts: [gitlab.com, altssh.gitlab.com]
  mcp: [gitlab]
  mcp_packages: ["@modelcontextprotocol/server-gitlab", "@zereight/mcp-gitlab"]
  mcp_hosts: [gitlab.com]
