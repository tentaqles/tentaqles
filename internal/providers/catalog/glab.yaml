id: glab
name: GitLab
category: vcs
docs: https://gitlab.com/gitlab-org/cli
cli:
  command: glab
  version_args: ["--version"]
install:
  windows:
    winget: "GLab.GLab"
    scoop: "glab"
  macos:
    brew: "glab"
  linux:
    apt: "glab"
identity:
  env:
    GLAB_CONFIG_DIR: "{dir}"
login:
  args: ["auth", "login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [glab]
  env: [GITLAB_TOKEN, GLAB_CONFIG_DIR, GITLAB_HOST]
