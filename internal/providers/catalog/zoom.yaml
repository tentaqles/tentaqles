id: zoom
name: Zoom
category: chat
docs: https://developers.zoom.us/docs/api/
# No official command-line client; reached through the REST API or an MCP connector only.
cli: null
notes: "No CLI to install or log in. Server-to-server OAuth credentials are the credential; a Claude session reaches Zoom through an MCP connector added to claude.bundle.mcp."
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  env: [ZOOM_ACCOUNT_ID, ZOOM_CLIENT_ID, ZOOM_CLIENT_SECRET]
  paths: ["%APPDATA%/Zoom", "~/.zoom", "~/Library/Application Support/zoom.us"]
  hosts: [api.zoom.us, zoom.us/oauth/]
  mcp: [zoom]
