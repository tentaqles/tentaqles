id: npm
name: npm
category: other
docs: https://docs.npmjs.com/cli
cli:
  command: npm
  version_args: ["--version"]
install:
  windows:
    winget: "OpenJS.NodeJS"
  macos:
    brew: "node"
  linux:
    # Debian's and Ubuntu's nodejs package holds no npm binary; the npm package holds it.
    apt: "npm"
identity:
  env:
    NPM_CONFIG_USERCONFIG: "{dir}/npmrc"
login:
  args: ["login"]
# A generic tool: its command talks to whatever the project configures, so a client's terminal
# never hides it.
match: {}
