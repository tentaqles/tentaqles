# Generated from verified research; edit deliberately.
id: wrangler
name: "Cloudflare"
category: deploy
docs: https://developers.cloudflare.com/workers/wrangler/
cli:
  command: wrangler
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [wrangler, cloudflared]
  env: [CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, CF_API_TOKEN]
