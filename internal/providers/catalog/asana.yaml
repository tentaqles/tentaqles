id: asana
name: Asana
category: pm
docs: https://developers.asana.com
cli: null
notes: "No CLI login. A Claude session reaches Asana through an MCP server added in that client's Claude config (claude mcp add), signed in with /mcp."
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  env: [ASANA_ACCESS_TOKEN, ASANA_PAT]
