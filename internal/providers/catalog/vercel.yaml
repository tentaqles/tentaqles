id: vercel
name: Vercel
category: deploy
docs: https://vercel.com/docs/cli
cli:
  command: vercel
  version_args: ["--version"]
install:
  windows:
    npm: "vercel"
  macos:
    npm: "vercel"
  linux:
    npm: "vercel"
login:
  args: ["login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [vercel, vc]
  env: [VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID]
