id: terraform
name: Terraform
category: deploy
docs: https://developer.hashicorp.com/terraform/cli
cli:
  command: terraform
  version_args: ["--version"]
install:
  windows:
    winget: "HashiCorp.Terraform"
  macos:
    brew: "terraform"
  linux:
    apt: "terraform"
identity:
  env:
    TF_CLI_CONFIG_FILE: "{dir}/terraformrc"
  # Verified by running the CLI: with TF_CLI_CONFIG_FILE pointed at a scratch
  # path, `terraform login -help` still reports it will write credentials to
  # the shared terraform.d directory under APPDATA. The variable moves settings,
  # provider mirrors and any hand-written credentials block -- but not the
  # token `terraform login` stores, and no TF_* variable moves terraform.d.
  caveat: >-
    settings and provider mirrors are isolated, but the token from
    `terraform login` is not: it goes to the shared terraform.d directory
    regardless of TF_CLI_CONFIG_FILE
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
# A generic tool: its command talks to whatever the project configures, so it is
# never matched by name.
match:
  env: ["TF_TOKEN_*"]
  hosts: [app.terraform.io]
  mcp_packages: ["hashicorp/terraform-mcp-server"]
