id: azure-devops
name: Azure DevOps
category: pm
docs: https://learn.microsoft.com/azure/devops/cli
# The same CLI as the az entry, so it shares az's config-home variable: a workspace that enables
# both gets one AZURE_CONFIG_DIR (envplan keeps the first, az). Boards sync takes its token from
# `az account get-access-token` inside that directory.
cli:
  command: az
  version_args: ["--version"]
install:
  windows:
    winget: "Microsoft.AzureCLI"
    note: "then: az extension add --name azure-devops"
  macos:
    brew: "azure-cli"
    note: "then: az extension add --name azure-devops"
  linux:
    apt: "azure-cli"
    note: "then: az extension add --name azure-devops"
identity:
  env:
    AZURE_CONFIG_DIR: "{dir}"
# `az devops login` only stores a PAT; `az login` is the account login the token comes from.
login:
  args: ["login"]
verify:
  args: ["account", "show"]
  # Logged out, az prints "Please run 'az login' to setup account." and exits non-zero.
  logged_out_when: "az login"
  account: { json: user.name }
  subscription: { json: name }
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
# Note: azure-devops owns only the `az devops|repos|pipelines|boards|artifacts|login|extension` subcommands; the rest of `az` and ~/.azure belong to the az provider.
match:
  subcommands:
    az: [devops, repos, pipelines, boards, artifacts, login, extension, account, config, version]
  env: [AZURE_DEVOPS_EXT_PAT, AZURE_DEVOPS_ORG]
  hosts: [dev.azure.com]
  git_hosts: [dev.azure.com, ssh.dev.azure.com, vs-ssh.visualstudio.com]
  mcp: [devops, ado, azuredevops]
  mcp_packages: ["@azure-devops/"]
