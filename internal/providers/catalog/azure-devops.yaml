id: azure-devops
name: Azure DevOps
category: pm
docs: https://learn.microsoft.com/azure/devops/cli
# The same CLI as the az entry, so it shares az's config-home variable: a workspace that enables
# both gets one AZURE_CONFIG_DIR (envplan keeps the first, az). Boards sync takes its token from
# `az account get-access-token` inside that directory.
cli:
  command: az
  version_args: ["--version"]
install:
  windows:
    winget: "Microsoft.AzureCLI"
    note: "then: az extension add --name azure-devops"
  macos:
    brew: "azure-cli"
    note: "then: az extension add --name azure-devops"
  linux:
    apt: "azure-cli"
    note: "then: az extension add --name azure-devops"
identity:
  env:
    AZURE_CONFIG_DIR: "{dir}"
# `az devops login` only stores a PAT; `az login` is the account login the token comes from.
login:
  args: ["login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  subcommands:
    az: [devops, repos, pipelines, boards, artifacts, login, extension, account, config, version]
  env: [AZURE_DEVOPS_EXT_PAT, AZURE_DEVOPS_ORG]
