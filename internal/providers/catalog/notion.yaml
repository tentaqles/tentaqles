# Generated from verified research; edit deliberately.
id: notion
name: "Notion"
category: pm
docs: https://developers.notion.com/
cli:
  command: ntn
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [ntn]
  env: [NOTION_TOKEN, NOTION_API_KEY]
