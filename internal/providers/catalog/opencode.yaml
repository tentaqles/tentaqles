# OPENCODE_CONFIG_DIR unverified
id: opencode
name: opencode
category: agent
docs: https://opencode.ai/docs/config/
cli:
  command: opencode
  version_args: ["--version"]
install:
  windows:
    url: https://opencode.ai/install
    note: "OPENCODE_CONFIG_DIR unverified — confirm against opencode docs"
  macos:
    url: https://opencode.ai/install
    note: "OPENCODE_CONFIG_DIR unverified — confirm against opencode docs"
  linux:
    url: https://opencode.ai/install
    note: "OPENCODE_CONFIG_DIR unverified — confirm against opencode docs"
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [opencode]
