# Generated from verified research; edit deliberately.
id: flyctl
name: "Fly.io"
category: cloud
docs: https://fly.io/docs/flyctl/
cli:
  command: flyctl
  version_args: ["version"]
install:
  windows:
    winget: "Fly-io.flyctl"
    scoop: "flyctl"
  macos:
    brew: "flyctl"
  linux:
    brew: "flyctl"
# config.yml under the directory holds access_token; no keychain.
identity:
  env:
    FLY_CONFIG_DIR: "{dir}"
login:
  args: ["auth", "login"]
verify:
  args: ["auth", "whoami", "--json"]
  logged_out_when: 'no access token available|not logged in'
  account: { json: email }
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [flyctl, fly]
  env: [FLY_API_TOKEN, FLY_ACCESS_TOKEN, FLY_CONFIG_DIR]
