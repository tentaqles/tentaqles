# Generated from verified research; edit deliberately.
id: twilio
name: "Twilio"
category: deploy
docs: https://www.twilio.com/docs/twilio-cli/general-usage/profiles
cli:
  command: twilio
  version_args: ["--version"]
install:
  macos:
    brew: "twilio/brew/twilio"
  linux:
    apt: "twilio"
# config.json holds apiKey and apiSecret in cleartext; the keytar dependency was removed.
identity:
  caveat: >-
    `twilio profiles:list` prints nothing and exits 0 when no profile exists, so an empty result means logged out rather than an error
  env:
    TWILIO_CONFIG_DIR: "{dir}"
login:
  args: ["login"]
verify:
  args: ["profiles:list", "-o", "json"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
match:
  executables: [twilio]
  env: [TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_API_KEY, TWILIO_API_SECRET, TWILIO_CONFIG_DIR]
  paths: ["~/.twilio-cli"]
  hosts: [api.twilio.com]
  mcp: [twilio]
