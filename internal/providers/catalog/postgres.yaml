id: postgres
name: PostgreSQL
category: data
docs: https://www.postgresql.org/docs/current/app-psql.html
cli:
  command: psql
  version_args: ["--version"]
install:
  # No macOS and no Windows method. Homebrew's libpq is keg-only, so psql is never linked onto the
  # PATH. The winget package is the EDB server installer: it sets up a service and does not put psql
  # on the PATH, so the install could not end in "installed". Those two systems print the docs page.
  linux:
    apt: "postgresql-client"
identity:
  # libpq's own environment-variable documentation. PGPASSFILE holds the
  # credentials; PGSERVICEFILE holds the named connection services. The entry
  # previously declared no identity at all, so psql was catalogued but never
  # isolated.
  env:
    PGPASSFILE: "{dir}/pgpass"
    PGSERVICEFILE: "{dir}/pg_service.conf"
# A generic tool: its command talks to whatever the project configures, so a client's terminal
# never hides it.
match: {}
