id: postgres
name: PostgreSQL
category: data
docs: https://www.postgresql.org/docs/current/app-psql.html
cli:
  command: psql
  version_args: ["--version"]
install:
  windows:
    winget: "PostgreSQL.PostgreSQL"
  macos:
    brew: "libpq"
  linux:
    apt: "postgresql-client"
identity:
  # libpq's own environment-variable documentation. PGPASSFILE holds the
  # credentials; PGSERVICEFILE holds the named connection services. The entry
  # previously declared no identity at all, so psql was catalogued but never
  # isolated.
  env:
    PGPASSFILE: "{dir}/pgpass"
    PGSERVICEFILE: "{dir}/pg_service.conf"
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
# A generic tool: its command talks to whatever the project configures, so it is
# never matched by name.
# Cross-cloud local config (kubeconfig, npmrc, docker config, ...): the developer's
# own file, readable under any identity, so no path is claimed here.
match: {}
