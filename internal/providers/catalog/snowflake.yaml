id: snowflake
name: Snowflake
category: data
docs: https://docs.snowflake.com/en/developer-guide/snowflake-cli
cli:
  command: snow
  version_args: ["--version"]
install:
  windows:
    winget: "Snowflake.SnowflakeCLI"
    pip: "snowflake-cli"
  macos:
    brew: "snowflakedb/snowflake-cli/snowflake-cli"
    pip: "snowflake-cli"
  linux:
    pip: "snowflake-cli"
identity:
  env:
    SNOWFLAKE_HOME: "{dir}"
login:
  args: ["connection", "add"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [snow, snowsql]
  env: [SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD, SNOWFLAKE_PRIVATE_KEY_PATH, SNOWFLAKE_HOME, SNOWSQL_PWD]
