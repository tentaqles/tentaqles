id: snowflake
name: Snowflake
category: data
docs: https://docs.snowflake.com/en/developer-guide/snowflake-cli
cli:
  command: snow
  version_args: ["--version"]
install:
  windows:
    winget: "Snowflake.SnowflakeCLI"
    pip: "snowflake-cli"
  macos:
    brew: "snowflakedb/snowflake-cli/snowflake-cli"
    pip: "snowflake-cli"
  linux:
    pip: "snowflake-cli"
identity:
  env:
    SNOWFLAKE_HOME: "{dir}"
login:
  args: ["connection", "add"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  executables: [snow, snowsql]
  modules: [snowflake.cli]
  env: [SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PASSWORD, SNOWFLAKE_PRIVATE_KEY_PATH, SNOWFLAKE_HOME, SNOWSQL_PWD]
  paths: ["~/.snowflake", "~/.snowsql"]
  hosts: [snowflakecomputing.com]
  mcp: [snowflake]
  mcp_packages: ["snowflake-labs-mcp"]
