id: snowflake
name: Snowflake
category: data
docs: https://docs.snowflake.com/en/developer-guide/snowflake-cli
cli:
  command: snow
  version_args: ["--version"]
install:
  windows:
    winget: "Snowflake.SnowflakeCLI"
    pip: "snowflake-cli"
  macos:
    brew: "snowflakedb/snowflake-cli/snowflake-cli"
    pip: "snowflake-cli"
  linux:
    pip: "snowflake-cli"
identity:
  env:
    SNOWFLAKE_HOME: "{dir}"
login:
  args: ["connection", "add"]
