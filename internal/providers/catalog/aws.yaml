id: aws
name: AWS
category: cloud
docs: https://docs.aws.amazon.com/cli
cli:
  command: aws
  version_args: ["--version"]
install:
  windows:
    winget: "Amazon.AWSCLI"
    url: "https://awscli.amazonaws.com/AWSCLIV2.msi"
  macos:
    url: "https://awscli.amazonaws.com/AWSCLIV2.pkg"
  linux:
    apt: "awscli"
    url: "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip"
identity:
  # Static-key profiles isolate cleanly. The SSO and CLI token caches under
  # ~/.aws/sso/cache and ~/.aws/cli/cache are not moved by either variable, so
  # workspaces sharing an SSO start URL share that cache.
  caveat: >-
    static credentials are isolated, but `aws sso login` tokens are cached in
    the shared ~/.aws/sso/cache and are not
  env:
    AWS_CONFIG_FILE: "{dir}/config"
    AWS_SHARED_CREDENTIALS_FILE: "{dir}/credentials"
login:
  args: ["configure"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [aws, aws_completer, sam, eksctl, cdk, aws-cdk, amplify]
  env: [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_SECURITY_TOKEN, AWS_PROFILE, AWS_DEFAULT_PROFILE, AWS_CONFIG_FILE, AWS_SHARED_CREDENTIALS_FILE, AWS_ROLE_ARN, AWS_WEB_IDENTITY_TOKEN_FILE, AWS_CONTAINER_CREDENTIALS_FULL_URI, AWS_REGION, AWS_DEFAULT_REGION]
