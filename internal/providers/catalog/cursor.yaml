id: cursor
name: Cursor
category: agent
docs: https://docs.cursor.com
cli:
  command: agent
  version_args: ["--version"]
install:
  windows:
    url: https://cursor.com/download
  macos:
    url: https://cursor.com/download
  linux:
    url: https://cursor.com/download
# CURSOR_CONFIG_DIR is a real, documented variable -- but it relocates
# cli-config.json, which holds CLI settings and tool permissions, NOT the
# credential. Cursor's changelog documents AGENT_CLI_CREDENTIAL_STORE=file as
# the way to stop using the OS keychain, which means the keychain is the
# default and no config-dir variable reaches it.
#
# Declaring it here would have told the user this CLI was isolated per
# workspace while every workspace shared one login. No identity block is the
# honest answer until someone confirms where the file store actually lands.
login:
  args: ["login"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
# Note: the CLI's command is `agent`, a name too generic to deny; cursor-agent is matched.
match:
  executables: [cursor-agent]
  paths: ["~/.cursor/cli-config.json"]
  mcp: [cursor]
