id: google-meet
name: Google Meet
category: chat
docs: https://developers.google.com/workspace/meet/api
# No command-line client; reached through the Meet REST API or an MCP connector only.
cli: null
notes: "No CLI to install or log in. A Claude session reaches Google Meet through an MCP connector added to claude.bundle.mcp, authenticated with /mcp."
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  hosts: [meet.googleapis.com]
  mcp: [googlemeet]
