id: claude
name: Claude Code
category: agent
docs: https://docs.claude.com/claude-code
cli:
  command: claude
  version_args: ["--version"]
install:
  windows:
    url: https://claude.ai/install
    note: native installer
  macos:
    url: https://claude.ai/install
    note: native installer
  linux:
    url: https://claude.ai/install
    note: native installer
identity:
  env:
    CLAUDE_CONFIG_DIR: "{dir}"
# `claude /login` would pass /login as the first prompt of an interactive
# session, so the session authenticates and then runs the slash command --
# the user is asked to log in twice. `claude auth login` is the real
# subcommand and matches every other provider here.
login:
  args: ["auth", "login"]
verify:
  args: ["auth", "status"]
  # Output is JSON on both Windows and macOS (verified on each):
  #   {"loggedIn": true, "authMethod": "claude.ai", "email": "...",
  #    "orgName": "...", "subscriptionType": "max"}
  logged_out_when: '"loggedIn" *: *false'
  account: { json: email }
  subscription: { json: subscriptionType }
