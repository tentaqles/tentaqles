id: linear
name: Linear
category: pm
docs: https://linear.app/developers
cli: null
mcp: linear
notes: "No CLI login: store a personal API key with tq secret set <ws> linear (auth keychain), or name the variable in tracker.env for tq dotenv (auth env). The Linear MCP connector covers a Claude session."
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  env: [LINEAR_API_KEY]
  hosts: [api.linear.app]
  mcp: [linear]
