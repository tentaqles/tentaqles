id: kube
name: Kubernetes
category: deploy
docs: https://kubernetes.io/docs/reference/kubectl
cli:
  command: kubectl
  version_args: ["version", "--client"]
install:
  windows:
    winget: "Kubernetes.kubectl"
  macos:
    brew: "kubectl"
  linux:
    apt: "kubectl"
identity:
  env:
    KUBECONFIG: "{dir}/config"
# A generic tool: its command talks to whatever the project configures, so a client's terminal
# never hides it.
match: {}
