# Generated from verified research; edit deliberately.
id: pulumi
name: "Pulumi"
category: deploy
docs: https://www.pulumi.com/docs/iac/cli/environment-variables/
cli:
  command: pulumi
  version_args: ["version"]
install:
  windows:
    winget: "Pulumi.Pulumi"
  macos:
    brew: "pulumi"
  linux:
    brew: "pulumi"
# Documented as holding plugins, workspaces, templates and the credentials file.
identity:
  env:
    PULUMI_HOME: "{dir}"
login:
  args: ["login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  env: [PULUMI_ACCESS_TOKEN]
