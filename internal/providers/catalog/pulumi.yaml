# Generated from verified research; edit deliberately.
id: pulumi
name: "Pulumi"
category: deploy
docs: https://www.pulumi.com/docs/iac/cli/environment-variables/
cli:
  command: pulumi
  version_args: ["version"]
install:
  windows:
    winget: "Pulumi.Pulumi"
  macos:
    brew: "pulumi"
  linux:
    brew: "pulumi"
# Documented as holding plugins, workspaces, templates and the credentials file.
identity:
  env:
    PULUMI_HOME: "{dir}"
login:
  args: ["login"]
verify:
  args: ["whoami", "--json"]
  account: { json: user }
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
# A generic tool: its command talks to whatever the project configures, so it is
# never matched by name.
match:
  env: [PULUMI_ACCESS_TOKEN]
  hosts: [api.pulumi.com]
  mcp_packages: ["@pulumi/mcp-server"]
  mcp_hosts: [mcp.ai.pulumi.com]
