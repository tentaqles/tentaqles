# Generated from verified research; edit deliberately.
id: pulumi
name: "Pulumi"
category: deploy
docs: https://www.pulumi.com/docs/iac/cli/environment-variables/
cli:
  command: pulumi
  version_args: ["version"]
install:
  windows:
    winget: "Pulumi.Pulumi"
  macos:
    brew: "pulumi"
  linux:
    brew: "pulumi"
# Documented as holding plugins, workspaces, templates and the credentials file.
identity:
  env:
    PULUMI_HOME: "{dir}"
login:
  args: ["login"]
verify:
  args: ["whoami", "--json"]
  account: { json: user }
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
# A generic tool: it talks to whatever the project configures, so its command is
# never denied by name; only its global credential files and vendor endpoints are.
match:
  env: [PULUMI_ACCESS_TOKEN]
  paths: ["~/.pulumi/credentials.json"]
  hosts: [api.pulumi.com]
