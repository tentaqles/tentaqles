# Generated from verified research; edit deliberately.
id: docker
name: "Docker"
category: deploy
docs: https://docs.docker.com/reference/cli/docker/
cli:
  command: docker
# NOT isolatable by an environment variable, deliberately:
# DOCKER_CONFIG moves config.json -- settings, contexts, the registry list -- but NOT credentials: a default Windows or macOS install uses a compiled-in credential helper (wincred, osxkeychain, desktop). Settings-isolated, identity-shared.
# Catalogued so tq can detect whether it is installed and a workspace can
# record that a client uses it -- but with no identity block, because
# claiming one tq cannot honour is worse than claiming none.
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
# A generic tool: its command talks to whatever the project configures, so it is
# never matched by name.
# Cross-cloud local config (kubeconfig, npmrc, docker config, ...): the developer's
# own file, readable under any identity, so no path is claimed here.
match: {}
