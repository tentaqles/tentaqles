id: jira
name: Jira
category: pm
docs: https://developer.atlassian.com/cloud/acli/
cli:
  command: acli
  version_args: ["--version"]
install:
  windows:
    url: https://developer.atlassian.com/cloud/acli/guides/install-windows/
  macos:
    brew: "atlassian/homebrew-acli/acli"
  linux:
    url: https://developer.atlassian.com/cloud/acli/guides/install-linux/
# No identity block: acli keeps one login per machine and no config-home variable has been
# verified, so tq does not claim to isolate it.
login:
  args: ["jira", "auth", "login"]
verify:
  args: ["jira", "auth", "status"]
mcp: atlassian
notes: "acli keeps one global login, not one per workspace: run acli jira auth login yourself. Without acli, store an API token with tq secret set <ws> jira, or name a tracker.env variable for tq dotenv."
# connect: the hosted (Atlassian Rovo) MCP server `tentaqles connect jira` registers (ADR-0017).
# Vendor docs: https://support.atlassian.com/rovo/docs/getting-started-with-the-atlassian-remote-mcp-server/
# The docs now name https://mcp.atlassian.com/v2/mcp; v1 still answers and moves to the v2 tools on 2027-03-01.
# The entry stays v1 for now: the hook's cross-client exemption needs a connected entry to equal this one, so a
# change here is an owner's call with a note for every client already connected.
connect:
  name: atlassian
  transport: http
  url: https://mcp.atlassian.com/v1/mcp
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0007; docs/PROVIDERS.md, "Match lists").
match:
  executables: [acli, jira]
  env: [JIRA_API_TOKEN, ATLASSIAN_API_TOKEN]
  hosts: [atlassian.net, api.atlassian.com]
  mcp: [atlassian, jira]
  mcp_hosts: [mcp.atlassian.com]
