id: jira
name: Jira
category: pm
docs: https://developer.atlassian.com/cloud/acli/
cli:
  command: acli
  version_args: ["--version"]
install:
  windows:
    url: https://developer.atlassian.com/cloud/acli/guides/install-windows/
  macos:
    brew: "atlassian/homebrew-acli/acli"
  linux:
    url: https://developer.atlassian.com/cloud/acli/guides/install-linux/
# No identity block: acli keeps one login per machine and no config-home variable has been
# verified, so tq does not claim to isolate it.
login:
  args: ["jira", "auth", "login"]
notes: "acli keeps one global login, not one per client: run acli jira auth login yourself. A Claude session can reach Jira through the Atlassian MCP server added in that client's Claude config."
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [acli, jira]
  env: [JIRA_API_TOKEN, ATLASSIAN_API_TOKEN]
