# Generated from verified research; edit deliberately.
id: linode-cli
name: "Linode / Akamai"
category: cloud
docs: https://techdocs.akamai.com/cloud-computing/docs/cli
cli:
  command: linode-cli
  version_args: ["--version"]
install:
  windows:
    pip: "linode-cli"
  macos:
    brew: "linode-cli"
  linux:
    pip: "linode-cli"
# INI file, one section per user, each holding a token. --skip-config keeps show-users from blocking on stdin.
identity:
  env:
    LINODE_CLI_CONFIG: "{dir}/linode-cli"
login:
  args: ["configure"]
verify:
  args: ["--skip-config", "show-users"]
  account: { regex: '^\*\s+(\S+)' }
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
match:
  executables: [linode-cli, linode]
  modules: [linodecli]
  env: [LINODE_CLI_TOKEN, LINODE_TOKEN, LINODE_CLI_CONFIG]
  paths: ["~/.config/linode-cli"]
  hosts: [api.linode.com]
  mcp: [linode, akamai]
