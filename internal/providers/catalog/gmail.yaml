id: gmail
name: Gmail
category: email
docs: https://developers.google.com/gmail/api
# MCP only (spec B §3).
cli: null
mcp: gmail
notes: "Reached through an MCP connector only. Add the gmail entry to the tq bundle catalog and to claude.bundle.mcp, run tq bundle sync <ws>, then authenticate with /mcp in a Claude session (or connect Gmail on claude.ai)."
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
match:
  hosts: [gmail.googleapis.com]
  mcp: [gmail]
