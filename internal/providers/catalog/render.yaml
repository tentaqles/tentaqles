# Generated from verified research; edit deliberately.
id: render
name: "Render"
category: cloud
docs: https://render.com/docs/cli
cli:
  command: render
  version_args: ["--version"]
install:
  macos:
    brew: "render"
  linux:
    brew: "render"
# cli.yaml holds api.key and the refresh token. The legacy RENDER_CLI_CONFIG_PATH moves the file but not state/.
identity:
  env:
    RENDER_CLI_CONFIG_DIR: "{dir}"
login:
  args: ["login"]
# match: what a client's terminal hides when this provider is outside the client's scope: its
# CLIs (masked on the client's PATH) and its variables (unset).
match:
  executables: [render]
  env: [RENDER_API_KEY, RENDER_CLI_CONFIG_DIR]
