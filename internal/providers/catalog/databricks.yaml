id: databricks
name: Databricks
category: data
docs: https://docs.databricks.com/en/dev-tools/cli/index.html
cli:
  command: databricks
  version_args: ["--version"]
install:
  windows:
    winget: "Databricks.DatabricksCLI"
  macos:
    brew: "databricks"
  linux:
    url: https://docs.databricks.com/dev-tools/cli/install.html
identity:
  env:
    DATABRICKS_CONFIG_FILE: "{dir}/databrickscfg"
login:
  args: ["configure"]
# match: what the guard's identity category recognises as this provider when an
# identity's scope leaves it out (ADR-0006; docs/PROVIDERS.md, "Match lists").
match:
  executables: [databricks]
  modules: [databricks_cli]
  env: [DATABRICKS_HOST, DATABRICKS_TOKEN, DATABRICKS_CLIENT_ID, DATABRICKS_CLIENT_SECRET, DATABRICKS_CONFIG_FILE, DATABRICKS_CONFIG_PROFILE]
  paths: ["~/.databrickscfg", "~/.databricks"]
  hosts: [cloud.databricks.com, azuredatabricks.net, gcp.databricks.com]
  mcp: [databricks]
